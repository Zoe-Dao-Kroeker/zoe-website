name: Deploy to Kinsta Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KINSTA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.KINSTA_SSH_PORT }} ${{ secrets.KINSTA_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync to Kinsta Staging
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.KINSTA_SSH_PORT }}" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            ./ ${{ secrets.KINSTA_SSH_USERNAME }}@${{ secrets.KINSTA_SSH_HOST }}:${{ secrets.KINSTA_THEME_PATH }}
